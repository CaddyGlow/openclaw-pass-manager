name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set package and manifest versions from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag version ($TAG_VERSION) is not a valid semver version."
            exit 1
          fi
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          TAG_VERSION="$TAG_VERSION" node -e "const fs=require('fs'); const path='openclaw.plugin.json'; const data=JSON.parse(fs.readFileSync(path,'utf8')); data.version=process.env.TAG_VERSION; fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');"

      - name: Run tests
        run: npm test

      - name: Run type check
        run: npm run lint

      - name: Build npm package tarball
        id: pack
        run: |
          PACKAGE_FILE="$(npm pack --json | node -e "const fs = require('fs'); const out = JSON.parse(fs.readFileSync(0, 'utf8')); process.stdout.write(out[0].filename)")"
          echo "package_file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload package
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.pack.outputs.package_file }}

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
